[package]
name = "policy-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Derives confidential-rail policy from an ERC-3643 identity registry, on-chain"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27"

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
