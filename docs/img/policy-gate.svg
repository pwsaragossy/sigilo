<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 630" width="920" height="630" role="img" aria-labelledby="t d">
<title id="t">One identity policy, two enforcement points</title>
<desc id="d">An identity registry is consulted by two independent enforcement points. The permissioned token asks it who may hold the asset. The PolicyBridge contract asks it before moving the allow-list or blocklist that decide who may spend inside the confidential payment pool. The issuer has no path to those lists except through the contract, which holds no private key.</desc>

<rect x="0" y="0" width="920" height="630" fill="#0a0c10"/>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8d8b86"/>
  </marker>
</defs>

<!-- identity registry -->
<rect x="286" y="40" width="348" height="78" rx="4" fill="#12151c" stroke="#1e232d"/>
<text x="460" y="72" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="16" fill="#e8e4dc" letter-spacing="1.5">IDENTITY REGISTRY</text>
<text x="460" y="96" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#8d8b86">ERC-3643 · one KYC credential per holder</text>

<!-- split -->
<path d="M460 118 L460 156" stroke="#1e232d" stroke-width="1.5" fill="none"/>
<path d="M460 156 L230 156 L230 204" stroke="#1e232d" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M460 156 L690 156 L690 204" stroke="#1e232d" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="222" y="182" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#8d8b86">can_transfer()</text>
<text x="698" y="182" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#8d8b86">is_verified()</text>

<!-- permissioned token -->
<rect x="60" y="210" width="340" height="146" rx="4" fill="#12151c" stroke="#1e232d"/>
<text x="230" y="244" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" fill="#e8e4dc" letter-spacing="1.2">PERMISSIONED TOKEN</text>
<text x="230" y="267" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#8d8b86">OpenZeppelin RWA</text>
<path d="M92 284 L368 284" stroke="#1e232d"/>
<text x="230" y="312" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="14" fill="#c8963e" letter-spacing="1.2">WHO MAY HOLD</text>
<text x="230" y="336" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#8d8b86">the asset itself refuses the uncredentialed</text>

<!-- policy gate -->
<rect x="520" y="210" width="340" height="146" rx="4" fill="#12151c" stroke="#c8963e"/>
<text x="690" y="244" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" fill="#e8e4dc" letter-spacing="1.2">POLICY GATE</text>
<text x="690" y="267" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#c8963e">PolicyBridge — this project</text>
<path d="M552 284 L828 284" stroke="#1e232d"/>
<text x="552" y="308" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#4fb286">grant</text>
<text x="614" y="308" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#8d8b86">→ allow-list insert</text>
<text x="552" y="328" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#d1584f">revoke</text>
<text x="614" y="328" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#8d8b86">→ blocklist insert</text>
<text x="690" y="348" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#8d8b86">each move only after asking the registry</text>

<!-- gate to pool -->
<path d="M690 356 L690 400" stroke="#1e232d" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="700" y="383" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#8d8b86">sole admin</text>

<!-- confidential payments -->
<rect x="520" y="404" width="340" height="140" rx="4" fill="#12151c" stroke="#1e232d"/>
<text x="690" y="438" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" fill="#e8e4dc" letter-spacing="1.2">CONFIDENTIAL PAYMENTS</text>
<text x="690" y="461" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#8d8b86">privacy pool · allow-list + blocklist</text>
<path d="M552 478 L828 478" stroke="#1e232d"/>
<text x="690" y="506" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="14" fill="#c8963e" letter-spacing="1.2">WHO MAY SPEND</text>
<text x="690" y="529" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#8d8b86">proofs checked against the current roots</text>

<!-- the refused path -->
<text x="106" y="441" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#8d8b86">issuer</text>
<path d="M164 436 L318 436" stroke="#d1584f" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
<path d="M356 436 L512 436" stroke="#d1584f" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
<path d="M328 427 L346 445 M346 427 L328 445" stroke="#d1584f" stroke-width="2"/>
<text x="290" y="472" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#d1584f">no direct path to the lists</text>
<text x="290" y="493" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#8d8b86">the contract has no private key,</text>
<text x="290" y="510" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#8d8b86">so the network refuses the issuer</text>

<!-- footer -->
<path d="M60 576 L860 576" stroke="#1e232d"/>
<text x="460" y="601" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#8d8b86">One credential, two enforcement points — so revoking it reaches money already inside the pool.</text>
</svg>
